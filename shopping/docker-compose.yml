services:
  shopping:
    container_name: c-shopping
    build: .
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
      DB_URL: mongodb://shopping-db:27017/shopping
      PRODUCTS_SERVICE_URL: http://c-products:8002
      APP_SECRET: dev-secret-change-me
    depends_on:
      - shopping-db
    networks:
      - microservices
      - default

  shopping-db:
    container_name: c-shopping-db
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - shopping-data:/data/db

volumes:
  shopping-data:

networks:
  microservices:
    external: true

